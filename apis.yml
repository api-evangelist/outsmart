aid: outsmart
name: Outsmart
description: 'Outsmart (Outsmart Education) is an early-stage EdTech startup building a consumer,
  mobile-first learning experience for higher education in the age of AI — "the university of the future."
  Founded by former Duolingo executives and backed by roughly $38M from investors including Forerunner,
  Khosla, Lightspeed, DST, Abstract, Karman, Latitud, and Reach, with teams in LA, SF, and Salt Lake City.
  The product is a pre-launch waitlist app (iOS and Android, built with React Native, Rive, and Unity)
  emphasizing content generation at scale, gamification, and benchmarking. As of this profile the company
  publishes a marketing/waitlist site only; it exposes no public API, developer portal, or documentation.'
